[project]
name = "matryoshka-attribution"
version = "0.1.0"
description = "MLP neuron attribution via adaptive sigmoid top-k masking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "matplotlib>=3.10.9",
    "plotnine>=0.15.4",
    "scipy>=1.17.1",
    "pyyaml>=6.0",
    "wandb>=0.19.0",
    "scikit-learn>=1.9.0",
]
# torch is NOT a project dependency: each environment group below pins its own, because the
# groups exist precisely where the torch / transformers / transformer-lens stack cannot be shared.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matryoshka_attribution"]

[dependency-groups]
# The language-model stack every LM experiment needs. Installed by default (`uv sync` / `uv run`).
lm = ["torch>=2.12.0", "transformers>=5.9.0", "transformer-lens>=3.2.1"]
# ViT teaser (scripts/vit): torchvision ViT + AttnLRP via lxt/zennit. lxt 2.1 imports transformers
# internals removed in v5, so this group cannot share an environment with `lm`; it lives in its own
# uv-managed env:  UV_PROJECT_ENVIRONMENT=.venv-vit uv run --no-default-groups --group vit python ...
vit = ["torch>=2.12.0", "torchvision>=0.27.0", "zennit>=1.0.0", "lxt>=2.1", "transformers>=4.51,<5"]
# The MIB fork's evaluation stack (TL 2.x). MANDATORY for every gemma2 cell: TL 3.2.1's Gemma-2
# forward is wrong (README.md, proved against HF in 525673a), and every gemma2 number in the paper
# was produced under exactly these pins (the Tilde venv, frozen 2026-09-16). Same arrangement as
# `vit`: its own uv-managed env, synced from the lockfile by the job itself --
#   UV_PROJECT_ENVIRONMENT=.venv-tl2 uv run --no-default-groups --group tl2 python scripts/mib/eval_mib.py --model gemma2 ...
# The fork's own modules (MIB_circuit_track, eap) are put on sys.path by deps.find_mib_path, so
# nothing from deps/ is installed here.
tl2 = ["torch==2.5.1", "transformers==4.46.3", "transformer-lens==2.15.4"]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
default-groups = ["lm", "dev"]
conflicts = [
    [{ group = "lm" }, { group = "vit" }],
    [{ group = "lm" }, { group = "tl2" }],
    [{ group = "vit" }, { group = "tl2" }],
]
