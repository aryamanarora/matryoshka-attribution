[project]
name = "learning-to-attribute"
version = "0.1.0"
description = "MLP neuron attribution via adaptive sigmoid top-k masking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "matplotlib>=3.10.9",
    "plotnine>=0.15.4",
    "scipy>=1.17.1",
    "pyyaml>=6.0",
    "torch>=2.12.0",
    "wandb>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_to_attribute"]

[dependency-groups]
# The language-model stack every LM experiment needs. Installed by default (`uv sync` / `uv run`).
lm = ["transformers>=5.9.0", "transformer-lens>=3.2.1"]
# ViT teaser (scripts/vit): torchvision ViT + AttnLRP via lxt/zennit. lxt 2.1 imports transformers
# internals removed in v5, so this group cannot share an environment with `lm`; it lives in its own
# uv-managed env:  UV_PROJECT_ENVIRONMENT=.venv-vit uv run --no-default-groups --group vit python ...
vit = ["torchvision>=0.27.0", "zennit>=1.0.0", "lxt>=2.1", "transformers>=4.51,<5"]

[tool.uv]
default-groups = ["lm"]
conflicts = [[{ group = "lm" }, { group = "vit" }]]
