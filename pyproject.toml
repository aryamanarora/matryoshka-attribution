[project]
name = "learning-to-attribute"
version = "0.1.0"
description = "MLP neuron attribution via adaptive sigmoid top-k masking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "matplotlib>=3.10.9",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "transformers>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_to_attribute"]
